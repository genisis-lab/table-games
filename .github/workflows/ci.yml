name: Game and multiplayer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Test engines and interface
        run: npm test

      - name: Test Durable Object multiplayer
        run: npm run test:worker
        env:
          WRANGLER_LOG_PATH: /tmp/table-games-wrangler.log

      - name: Build production bundle
        run: npm run build
