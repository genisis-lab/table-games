          const source = readFileSync(path, "utf8");
          const before = '    include: ["worker/**/*.test.ts"]';
          const after = `    include: ["worker/**/*.test.ts"],
              // Cloudflare's pool requires shared storage for Durable Object WebSocket tests.
              isolate: false,
              maxWorkers: 1`;
