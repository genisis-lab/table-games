          tar -xzf "$RUNNER_TEMP/table-games-release-overlay.tar.gz" -C .
          rm .github/workflows/release-table-games-snapshot.yml
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Verify client and game engines
        run: npm test
      - name: Verify Durable Object multiplayer
        run: npm run test:worker
      - name: Build production Worker and client
        run: npm run build
      - name: Publish verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "genisis-lab"
          git config user.email "289522571+genisis-lab@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Release overlay already matches main."
            exit 0
          fi
          git commit -m "Add Chess, Set Trio, and multiplayer platform upgrades"
          git push origin HEAD:main
