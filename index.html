<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Table Sparks is a playful browser board-game room with live chat, invite links, and reactions."

    <meta name="theme-color" content="#f6b954" />

      rel="icon"

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Table Sparks" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Table Sparks" />
    <meta property="og:title" content="Table Sparks — Playful browser board games" />
    <meta
      property="og:description"
      content="Gather friends for playful browser board games with live chat, invite links, and reactions."
    />

      property="og:image"
      content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f8ce3a'/%3E%3Cpath d='M32 8v48M8 32h48' stroke='%23172331' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%2346d9b5' stroke='%23172331' stroke-width='5'/%3E%3C/svg%3E"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Table Sparks — Playful browser board games" />

      name="twitter:description"
