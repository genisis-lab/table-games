<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Table Games</title>
  <desc id="desc">A colorful social preview card for Table Games, playful browser board games for friends.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172331"/>
      <stop offset="1" stop-color="#263d4a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ce3a"/>
      <stop offset="1" stop-color="#f6b954"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ce7ca"/>
      <stop offset="1" stop-color="#46d9b5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071119" flood-opacity=".28"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1070" cy="-25" r="220" fill="#46d9b5" opacity=".12"/>
  <circle cx="1020" cy="590" r="260" fill="#f8ce3a" opacity=".1"/>
  <path d="M0 488C160 420 280 560 450 500s246-91 360-20 245 79 390 6v144H0Z" fill="#101b27" opacity=".62"/>

  <g transform="translate(700 86) rotate(7 200 200)" filter="url(#shadow)">
    <rect width="390" height="390" rx="34" fill="url(#panel)"/>
    <rect x="24" y="24" width="342" height="342" rx="22" fill="url(#grid)"/>
    <path d="M75 75h240v240H75z" fill="none" stroke="#172331" stroke-opacity=".25" stroke-width="5"/>
    <path d="M195 75v240M75 195h240" stroke="#172331" stroke-opacity=".25" stroke-width="5"/>
    <circle cx="195" cy="195" r="68" fill="url(#teal)" stroke="#172331" stroke-width="10"/>
    <path d="M195 143v104M143 195h104" stroke="#172331" stroke-width="12" stroke-linecap="round"/>
    <circle cx="75" cy="75" r="21" fill="#ef6b5b" stroke="#172331" stroke-width="7"/>
    <circle cx="315" cy="315" r="21" fill="#ef6b5b" stroke="#172331" stroke-width="7"/>
    <circle cx="315" cy="75" r="21" fill="#ffffff" stroke="#172331" stroke-width="7"/>
    <circle cx="75" cy="315" r="21" fill="#ffffff" stroke="#172331" stroke-width="7"/>
  </g>

  <g transform="translate(92 88)
    " fill="#f8ce3a">
    <rect width="78" height="78" rx="22"/>
    <path d="M39 13v52M13 39h52" stroke="#172331" stroke-width="7" stroke-linecap="round"/>
    <circle cx="39" cy="39" r="15" fill="#46d9b5" stroke="#172331" stroke-width="6"/>
  </g>

  <text x="92" y="264" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">TABLE</text>
  <text x="92" y="350" fill="#f8ce3a" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">GAMES</text>
  <text x="98" y="411" fill="#d7e4e8" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing=".5">Play together. Anywhere.</text>

  <g transform="translate(98 530)">
    <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity=".1"/>
    <circle cx="25" cy="24" r="7" fill="#46d9b5"/>
    <text x="46" y="32" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">table.builtwai.com</text>
  </g>
</svg>
